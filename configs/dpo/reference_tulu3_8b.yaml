schema_version: 2
stage: dpo
profile: canonical_tulu3_8b_reference
status: reference_only_requires_qwen3b_formal_pilot
source:
  repository: allenai/open-instruct
  commit: 8fcf9c6bae3e3a58e1fcb8c79c3bbfbd97065377
  path: scripts/train/tulu3/dpo_8b.sh
  entrypoint: open_instruct/dpo_tune_cache.py

lineage:
  upstream_reference_input: allenai/Llama-3.1-Tulu-3-8B-SFT
  project_input_stage: sft
  project_input_checkpoint: null

dataset:
  hf_id: allenai/llama-3.1-tulu-3-8b-preference-mixture
  weight: 1.0
  local_path: null
  revision: null

reference_training:
  precision: bf16
  max_seq_length: 2048
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 5.0e-7
  lr_scheduler_type: linear
  warmup_ratio: 0.1
  weight_decay: 0.0
  num_train_epochs: 1
  dpo_loss_type: dpo_norm
  dpo_beta: 5
  use_flash_attn: true
  gradient_checkpointing: true
  with_tracking: true
  report_to: wandb
  logging_steps: 1
  seed: 8

reference_parallelism:
  num_nodes: 4
  gpus_per_node: 8
  num_processes_per_node: 8
  deepspeed: stage3_no_offloading

implementation_note: >-
  The pinned dpo_tune_cache.py computes and caches reference chosen/rejected
  log-probabilities with the same pre-update model before optimization; it does
  not require a simultaneously resident second full reference model. The
  project will reuse this implementation contract.

method_note: >-
  These values are the exact lecture-era upstream Tulu3 8B DPO reference.
  Replacing the upstream SFT model with this project's Qwen2.5-3B SFT
  checkpoint is the intended lineage adaptation, but formal Qwen2.5-3B DPO
  resource feasibility and any hyperparameter changes remain pilot-gated.
