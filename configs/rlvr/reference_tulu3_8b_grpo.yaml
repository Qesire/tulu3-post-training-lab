schema_version: 1
stage: rlvr
profile: lecture_era_tulu3_8b_grpo_reference
status: reference_only_requires_qwen3b_formal_pilot

source:
  repository: allenai/open-instruct
  commit: 8fcf9c6bae3e3a58e1fcb8c79c3bbfbd97065377
  script: scripts/train/tulu3/grpo_8b.sh
  entrypoint: open_instruct/grpo_vllm_thread_ray_gtrl.py

lineage:
  reference_input_stage: dpo
  reference_model: allenai/Llama-3.1-Tulu-3-8B-DPO
  project_adaptation_input_stage: dpo

dataset:
  hf_id: allenai/RLVR-GSM-MATH-IF-Mixed-Constraints
  train_split: train
  eval_split: train
  eval_mixer_value: 16

algorithm:
  name: grpo
  rollout_backend: vllm_ray
  verifiable_reward: true
  reward_model_multiplier: 0.0
  beta: 0.01
  kl_estimator: kl3
  temperature: 1.0
  non_stop_penalty: true
  penalty_reward_value: 0.0

reference_training:
  local_mini_batch_size: 32
  number_samples_per_prompt: 16
  local_rollout_batch_size: 4
  learning_rate: 5.0e-7
  max_token_length: 2048
  max_prompt_token_length: 2048
  response_length: 2048
  total_episodes: 2000000
  deepspeed_stage: 2
  per_device_train_batch_size: 2
  local_rollout_forward_batch_size: 2
  actor_num_gpus_per_node: [4, 8]
  num_epochs: 1
  vllm_tensor_parallel_size: 1
  vllm_num_engines: 4
  lr_scheduler_type: constant
  seed: 1
  num_evals: 100
  save_freq: 40
  gradient_checkpointing: true

reference_cluster_shape:
  num_nodes: 2
  gpus_per_node_requested_by_mason: 8

provenance_note: >-
  These values are copied from the pinned lecture-era Tulu3 GRPO script. They
  establish the canonical upstream RLVR reference for the tutorial dataset but
  are not automatically a formal Qwen2.5-3B recipe.

claim_limit: lecture_era_upstream_reference_only
