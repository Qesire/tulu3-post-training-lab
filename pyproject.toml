[project]
name = "tulu3-post-training-lab"
version = "0.1.0"
description = "Lecture-6 Tulu3 post-training experiment orchestration for SFT, DPO and RLVR on Slurm RTX 5090"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
